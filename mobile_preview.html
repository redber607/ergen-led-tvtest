<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Önizleme - Ergen Led Tv</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        .device-wrapper {
            position: relative;
            width: 375px;
            height: 812px;
            background-color: #000;
            border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 12px solid #333;
            overflow: hidden;
        }

        /* Notch mockup */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #333;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff;
        }

        .info {
            position: absolute;
            left: 20px;
            top: 20px;
            color: #888;
            max-width: 200px;
        }

        .rotate-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            padding: 10px 20px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="info">
        <h3>Mobil Simülatör</h3>
        <p>375x812px (iPhone X)</p>
    </div>

    <div class="device-wrapper">
        <div class="notch"></div>
        <iframe src="index.html"></iframe>
    </div>

</body>

</html>
