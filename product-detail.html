<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı | Ergen Led Tv Elektronik</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-container {
            padding: 4rem 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        .product-image-large {
            width: 100%;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image-large img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .product-info-panel h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-meta {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .product-description {
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .price-large {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            display: block;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .action-buttons {
                flex-direction: column;
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary-red);
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo">Ergen <span style="color:white">Led Tv</span></a>
            <div class="menu-toggle"><i class="fas fa-bars"></i></div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="products.html">Ürünler</a></li>
                    <li><a href="about.html">Hakkımızda</a></li>
                    <li><a href="contact.html">İletişim</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="productDetailContent">
            <!-- Loading state -->
            <div style="padding: 10rem 0; text-align: center;">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: var(--accent-gold);"></i>
                <p style="margin-top: 1rem;">Ürün yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-container">
            <div class="social-links">
                <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fab fa-youtube"></i></a>
            </div>
            <div class="copyright">
                <p>&copy; 2026 Ergen Led Tv Elektronik</p>
                <div class="footer-links">
                    <a href="#" id="footerCookieLink">Çerez Politikası</a> |
                    <a href="#">Gizlilik ve Güvenlik</a>
                </div>
            </div>
        </div>
    </footer>

    <a href="https://wa.me/905000000000" class="whatsapp-btn" target="_blank"><i class="fab fa-whatsapp"
            style="font-size: 2rem;"></i></a>

    <script src="script.js"></script>
    <script>
        // Specific logic for product detail page if not handled by script.js main load

</body>

</html>
